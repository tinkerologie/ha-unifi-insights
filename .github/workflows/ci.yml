name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CODECOV_OIDC: >-
    ${{ !(github.event_name == 'pull_request' &&
    (github.event.pull_request.head.repo.fork ||
    github.event.pull_request.user.login == 'dependabot[bot]')) }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
      id-token: write # Codecov OIDC upload
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          # The Azure archive can stall for minutes before falling back.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list \
            /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors.txt; do
            if [[ -f "$source" ]]; then
              sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          # Ubuntu 24.04 provides libturbojpeg; 26.04 renamed it to libturbojpeg0.
          turbojpeg=libturbojpeg
          if apt-cache policy libturbojpeg0 | awk '/Candidate:/ && $2 != "(none)" { found = 1 } END { exit !found }'; then
            turbojpeg=libturbojpeg0
          fi
          echo "Installing TurboJPEG package: $turbojpeg"
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            ffmpeg \
            "$turbojpeg"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14.2

      - name: Install dependencies
        run: |
          uv venv --python 3.14.2
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          # pytest-home-assistant is not on PyPI yet: install it from the Core
          # tag that matches the Home Assistant pin. Keep HA_VERSION equal to
          # TEST_HOME_ASSISTANT_VERSION in script/test (bootstrap reads it from
          # there). Once the plugin is on PyPI, replace the URL with a version pin.
          HA_VERSION=2026.11.0b1
          uv pip install . ".[dev]" "homeassistant==$HA_VERSION" \
            "pytest-home-assistant @ https://github.com/home-assistant/core/archive/refs/tags/$HA_VERSION.tar.gz#subdirectory=packages/pytest-home-assistant"

      - name: Check Python types without errors or warnings
        run: ./script/type-check

      - name: Run tests and generate coverage report
        run: |
          pytest --cov --cov-branch --cov-report=xml

      - name: Check per-file coverage
        run: |
          python script/check_coverage_per_file.py coverage.xml --fail-under 95

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          slug: ${{ github.repository }}
          files: ./coverage.xml
          use_oidc: ${{ env.CODECOV_OIDC == 'true' }}
          fail_ci_if_error: ${{ env.CODECOV_OIDC == 'true' }}

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test with coverage
        run: npm test -- --coverage

      - name: Build bundle
        run: npm run build

      - name: Install Chromium
        run: |
          # Playwright installs system dependencies through the same apt mirror.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list \
            /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors.txt; do
            if [[ -f "$source" ]]; then
              sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          npx playwright install --with-deps chromium

      - name: Browser regression tests
        run: npm run test:browser

      - name: Upload browser test traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results
          path: frontend/test-results/
          retention-days: 7

      - name: Bundle size budget
        run: npm run size

      - name: Committed bundle matches source
        run: git diff --exit-code -- ../custom_components/unifi_insights/frontend/
