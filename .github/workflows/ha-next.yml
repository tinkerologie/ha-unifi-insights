name: HA Next

# Early warning for upcoming Home Assistant releases, on two channels:
# - release: the newest Home Assistant on PyPI, beta included;
# - dev: the head of Core's dev branch, weeks before the next beta.
# Removals and deprecations show up before the release ships. It never blocks a
# merge: the jobs continue on error, and scheduled or manual runs on main open
# (or close) one issue per channel, labelled ha-next and bug, instead.
on:
  schedule:
    - cron: 0 3 * * 1
      timezone: Australia/Brisbane
  workflow_dispatch:
    inputs:
      ha_version:
        description: Release channel version to test (blank for the newest, beta included)
        required: false
        default: ""
  pull_request:
    paths:
      - pyproject.toml
      - requirements*.txt
      - custom_components/unifi_insights/manifest.json
      - script/import_smoke.py
      - .github/workflows/ha-next.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ha-next:
    name: Next Home Assistant (${{ matrix.channel }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        channel: [release, dev]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          # The Azure archive can stall for minutes before falling back.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list \
            /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors.txt; do
            if [[ -f "$source" ]]; then
              sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          # Ubuntu 24.04 provides libturbojpeg; 26.04 renamed it to libturbojpeg0.
          turbojpeg=libturbojpeg
          if apt-cache policy libturbojpeg0 | awk '/Candidate:/ && $2 != "(none)" { found = 1 } END { exit !found }'; then
            turbojpeg=libturbojpeg0
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            ffmpeg \
            "$turbojpeg"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        run: |
          uv python install 3.14.2
          uv venv --python 3.14.2
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Resolve Home Assistant version
        id: resolve
        env:
          CHANNEL: ${{ matrix.channel }}
          REQUESTED_VERSION: ${{ inputs.ha_version }}
        run: |
          # pytest-home-assistant ships inside Core; install it from the same
          # archive as homeassistant so the two always match.
          core_archive=https://github.com/home-assistant/core/archive
          plugin_subdirectory=subdirectory=packages/pytest-home-assistant
          if [[ "$CHANNEL" == dev ]]; then
            # Pin one commit so the install and Hassfest test the same Core.
            revision=$(git ls-remote https://github.com/home-assistant/core.git refs/heads/dev | cut -f1)
            if [[ ! "$revision" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error::Could not resolve the head of Core's dev branch"
              exit 1
            fi
            echo "Home Assistant dev at $revision"
            # Core's source tree has no translations/ folders: release wheels
            # generate them at build time. Without them an entity named only by
            # its device class loses that name ("Office Router" instead of
            # "Office Router Connectivity"), so generate the English files the
            # way Core's developer setup does, then install from that tree.
            core_dir="$RUNNER_TEMP/ha-core"
            mkdir -p "$core_dir"
            curl -fsSL --retry 3 "$core_archive/$revision.tar.gz" |
              tar -xz -C "$core_dir" --strip-components=1
            (cd "$core_dir" &&
              uv run --no-project --python 3.14.2 --with orjson \
                python -m script.translations develop --all > /dev/null)
            {
              echo "ha_version=dev@${revision:0:12}"
              echo "requirement=homeassistant @ file://$core_dir"
              echo "plugin_requirement=pytest-home-assistant @ file://$core_dir/packages/pytest-home-assistant"
              echo "hassfest_ref=$revision"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "${REQUESTED_VERSION:-}" ]]; then
            if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
              echo "::error::Invalid Home Assistant version: $REQUESTED_VERSION"
              exit 1
            fi
            ha_version="$REQUESTED_VERSION"
          else
            # Newest non-yanked release, pre-releases included; when no beta is
            # out this is the latest stable release.
            ha_version=$(curl -fsSL --retry 3 https://pypi.org/pypi/homeassistant/json |
              uv run --no-project --with packaging python -c '
          import json, sys
          from packaging.version import Version
          releases = json.load(sys.stdin)["releases"]
          print(max(
              (v for v, files in releases.items()
               if files and not all(f.get("yanked") for f in files)),
              key=Version,
          ))
          ')
          fi
          echo "Home Assistant $ha_version"
          {
            echo "ha_version=$ha_version"
            echo "requirement=homeassistant==$ha_version"
            echo "plugin_requirement=pytest-home-assistant @ $core_archive/refs/tags/$ha_version.tar.gz#$plugin_subdirectory"
            echo "hassfest_ref=$ha_version"
          } >> "$GITHUB_OUTPUT"

      - name: Install Home Assistant and the test harness
        id: install
        env:
          REQUIREMENT: ${{ steps.resolve.outputs.requirement }}
          PLUGIN_REQUIREMENT: ${{ steps.resolve.outputs.plugin_requirement }}
        run: |
          # pytest-home-assistant ships with every Core release and commit, so
          # install it from the same tag or revision as homeassistant. A failed
          # install fails the channel; there is no smoke-test-only fallback.
          uv pip install . ".[dev]" "$REQUIREMENT" "$PLUGIN_REQUIREMENT"
          python -c "from homeassistant.const import __version__; print('Installed Home Assistant', __version__)"

      - name: Import every module and check for deprecations
        id: smoke
        continue-on-error: true
        run: python script/import_smoke.py

      - name: Run tests with deprecation checks
        id: tests
        continue-on-error: true
        run: pytest --no-cov -q

      - name: Validate with Hassfest from the same release
        id: hassfest
        continue-on-error: true
        env:
          HA_VERSION: ${{ steps.resolve.outputs.hassfest_ref }}
        run: ./script/hassfest --skip-plugins ""

      - name: Summarize
        id: summary
        if: always()
        env:
          CHANNEL: ${{ matrix.channel }}
          HA_VERSION: ${{ steps.resolve.outputs.ha_version }}
          INSTALL: ${{ steps.install.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          HASSFEST: ${{ steps.hassfest.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # A check that never ran fails too: a step that stops the job, such as
          # resolving the version, skips every check after it.
          status=success
          if [[ "$JOB_STATUS" != success ]]; then
            status=failure
          fi
          for outcome in "$INSTALL" "$SMOKE" "$TESTS" "$HASSFEST"; do
            if [[ "$outcome" != success ]]; then
              status=failure
            fi
          done
          {
            echo "## Home Assistant ${HA_VERSION:-unresolved}"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Install | ${INSTALL:-not run} |"
            echo "| Import smoke | ${SMOKE:-not run} |"
            echo "| Tests | ${TESTS:-not run} |"
            echo "| Hassfest | ${HASSFEST:-not run} |"
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p ha-next-result
          jq -n --arg channel "$CHANNEL" --arg version "${HA_VERSION:-unresolved}" --arg status "$status" \
            '{channel: $channel, version: $version, status: $status}' > "ha-next-result/$CHANNEL.json"
          if [[ "$status" == failure ]]; then
            echo "::error::Home Assistant ${HA_VERSION:-unresolved} breaks or deprecates something the integration uses"
            exit 1
          fi

      # Matrix jobs cannot each set a job output, so the report reads these files.
      - name: Upload the channel result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ha-next-${{ matrix.channel }}
          path: ha-next-result/
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: Report
    needs: ha-next
    if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read # download the channel results
      issues: write # open, update and close the ha-next issues
    steps:
      - name: Download the channel results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # a channel that stopped early uploaded nothing
        with:
          pattern: ha-next-*
          path: ha-next-result
          merge-multiple: true

      - name: Open, update or close the ha-next issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("node:fs");
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            // bug lets CodeRabbit plan the fix as soon as the issue opens.
            const labels = [
              { name: "ha-next", color: "fbca04", description: "Breakage or deprecation in the next Home Assistant release" },
              { name: "bug", color: "d73a4a", description: "Something isn't working" },
            ];
            const channels = {
              release: "Upcoming Home Assistant release breaks or deprecates something we use",
              dev: "Home Assistant Core dev breaks or deprecates something we use",
            };

            const { data: open } = await github.rest.issues.listForRepo({
              owner,
              repo,
              labels: "ha-next",
              state: "open",
              per_page: 50,
            });

            for (const [channel, title] of Object.entries(channels)) {
              let result = { version: "unresolved", status: "failure" };
              try {
                result = JSON.parse(fs.readFileSync(`ha-next-result/${channel}.json`, "utf8"));
              } catch {
                // No result means the job stopped before its summary step.
              }
              const marker = `<!-- ha-next:${channel} -->`;
              const issue = open.find((item) => !item.pull_request && item.body?.includes(marker));

              if (result.status === "success") {
                if (issue) {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issue.number,
                    body: `Home Assistant ${result.version} passes again: ${runUrl}`,
                  });
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: issue.number,
                    state: "closed",
                    state_reason: "completed",
                  });
                }
                continue;
              }

              const body = [
                marker,
                `The HA Next workflow failed on the ${channel} channel against Home Assistant ${result.version}.`,
                "",
                `Run log: ${runUrl}`,
                "",
                "See the run summary for which check failed (install, import smoke, tests or Hassfest),",
                "and the deprecation section of `.github/instructions/tests.instructions.md` for what to do.",
              ].join("\n");

              if (issue) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body,
                });
                continue;
              }

              for (const label of labels) {
                try {
                  await github.rest.issues.getLabel({ owner, repo, name: label.name });
                } catch (error) {
                  if (error.status !== 404) throw error;
                  await github.rest.issues.createLabel({ owner, repo, ...label });
                }
              }
              await github.rest.issues.create({
                owner,
                repo,
                title,
                labels: labels.map((label) => label.name),
                body,
              });
            }
