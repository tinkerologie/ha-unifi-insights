name: Release

on:
  push:
    branches: [main]
    paths:
      - custom_components/unifi_insights/manifest.json

permissions:
  contents: read # jobs request only what they need

# One release run at a time, never cancelled: the tag comes from manifest.json
# inside the job, so runs are serialised as a whole. A run must not delete or
# publish a draft another run is still filling.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the release commit
      id-token: write # mint the OIDC token that signs the attestation
      attestations: write # store the build provenance attestation
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.tag_check.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version from manifest
        id: version
        run: |
          VERSION=$(jq -r '.version' custom_components/unifi_insights/manifest.json)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        env:
          VERSION_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --tags origin "refs/tags/v${VERSION_VERSION}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release zip
        if: steps.tag_check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Timestamps come from the release commit, so the tag rebuilds byte-identically.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$GITHUB_SHA")
          export SOURCE_DATE_EPOCH
          python3 script/build_release_zip.py --output-dir dist --version "$TAG"

      - name: Attest build provenance
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/unifi_insights.zip

      - name: Upload release assets
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: build
    if: needs.build.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft, upload assets, publish the release and tag
      attestations: read # verify the attestation before publishing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Verify checksum and provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          # The same command the README gives users, pinned to this workflow.
          gh attestation verify dist/unifi_insights.zip --repo "$REPO" \
            --signer-workflow "$REPO/.github/workflows/release.yml"

      - name: Create draft release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # A rerun after a failed publish finds the earlier run's draft for
          # this tag (the tag itself only exists once a release is published):
          # delete it so the rerun starts from one clean draft.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$TAG" --yes
          fi
          # Immutable releases lock assets on publish, so upload to a draft first.
          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "See [CHANGELOG.md](https://github.com/$REPO/blob/main/CHANGELOG.md) for full details on what's changed in this release." \
            dist/unifi_insights.zip \
            dist/SHA256SUMS \
            CHANGELOG.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: gh release edit "$TAG" --draft=false

      - name: Verify the immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          # Fails when release immutability is off, so the setting can't lapse unnoticed.
          gh release verify "$TAG"
          gh release verify-asset "$TAG" dist/unifi_insights.zip
