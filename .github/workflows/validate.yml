name: Validate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: 0 0 * * *
      timezone: Australia/Brisbane
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: HACS Action
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  release-zip:
    name: Release zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build twice and compare
        run: |
          # The script refuses to write a zip with a broken layout; building twice
          # proves the same commit always gives the same bytes.
          VERSION=$(jq -r '.version' custom_components/unifi_insights/manifest.json)
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          python3 script/build_release_zip.py --output-dir dist/a --version "v${VERSION}"
          python3 script/build_release_zip.py --output-dir dist/b --version "v${VERSION}"
          cmp dist/a/unifi_insights.zip dist/b/unifi_insights.zip
          (cd dist/a && sha256sum -c SHA256SUMS)

  validate:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest

      - name: Validate with pinned isolated Hassfest
        run: ./script/hassfest --skip-plugins ""
