---
# Service definitions for UniFi Insights

# Core services
refresh_data:
  name: Refresh Data
  description: Force an immediate refresh of UniFi Insights data.
  fields:
    site_id:
      name: Site ID
      description: >-
        Optional site ID to refresh. If not specified, refreshes all sites.
      required: false
      selector:
        text:

restart_device:
  name: Restart Device
  description: Restart a UniFi device.
  fields:
    entity_id:
      name: Entity
      description: >-
        An entity of the device to target. Use this or the device ID.
      required: false
      selector:
        entity:
          integration: unifi_insights
    site_id:
      name: Site ID
      description: The site ID where the device is located (optional when targeting an entity or device).
      required: false
      selector:
        text:
    device_id:
      name: Device ID
      description: The ID of the device to restart.
      required: false
      selector:
        text:

power_cycle_port:
  name: Power Cycle PoE Port
  description: Power-cycle a PoE-enabled port on a UniFi network device.
  fields:
    entity_id:
      name: Entity
      description: >-
        An entity of the device to target. Use this or the device ID.
      required: false
      selector:
        entity:
          integration: unifi_insights
    site_id:
      name: Site ID
      description: The site ID where the device is located (optional when targeting a device).
      required: false
      selector:
        text:
    device_id:
      name: Device ID
      description: The ID of the device to power-cycle a port on.
      required: false
      selector:
        text:
    port_idx:
      name: Port Index
      description: The 1-based port index to power-cycle.
      required: true
      selector:
        number:
          min: 1
          mode: box

# UniFi Protect Camera services
set_hdr_mode:
  name: Set HDR Mode
  description: Set the HDR mode for a UniFi Protect camera.
  fields:
    entity_id:
      name: Entity
      description: >-
        An entity of the camera to target. Use this or the camera ID.
      required: false
      selector:
        entity:
          integration: unifi_insights
          domain: camera
    device_id:
      name: Device
      description: >-
        The camera device to target. Use this or the camera ID.
      required: false
      selector:
        device:
          integration: unifi_insights
    camera_id:
      name: Camera ID
      description: The ID of the camera
      required: false
      selector:
        text:
    mode:
      name: HDR Mode
      description: HDR mode (auto, on, off)
      required: true
      selector:
        select:
          options:
            - "auto"
            - "on"
            - "off"

set_video_mode:
  name: Set Video Mode
  description: Set the video mode (FPS) for a UniFi Protect camera.
  fields:
    entity_id:
      name: Entity
      description: >-
        An entity of the camera to target. Use this or the camera ID.
      required: false
      selector:
        entity:
          integration: unifi_insights
          domain: camera
    device_id:
      name: Device
      description: >-
        The camera device to target. Use this or the camera ID.
      required: false
      selector:
        device:
          integration: unifi_insights
    camera_id:
      name: Camera ID
      description: The ID of the camera
      required: false
      selector:
        text:
    mode:
      name: Video Mode
      description: >-
        Raw Protect video mode (default, highFps, sport, slowShutter, lprReflex,
        lprNoneReflex). These action values differ from the select entity keys.
      required: true
      selector:
        select:
          options:
            - label: Normal
              value: "default"
            - label: High frame rate
              value: "highFps"
            - label: Fast motion
              value: "sport"
            - label: Low light
              value: "slowShutter"
            - label: License plates (reflective)
              value: "lprReflex"
            - label: License plates (non-reflective)
              value: "lprNoneReflex"

set_mic_volume:
  name: Set Microphone Volume
  description: Set the microphone volume level for a UniFi Protect camera.
  fields:
    entity_id:
      name: Entity
      description: >-
        An entity of the camera to target. Use this or the camera ID.
      required: false
      selector:
        entity:
          integration: unifi_insights
          domain: camera
    device_id:
      name: Device
      description: >-
        The camera device to target. Use this or the camera ID.
      required: false
      selector:
        device:
          integration: unifi_insights
    camera_id:
      name: Camera ID
      description: The ID of the camera
      required: false
      selector:
        text:
    volume:
      name: Volume
      description: Microphone volume level (1-100)
      required: true
      selector:
        number:
          min: 1
          max: 100
          step: 1

ptz_move:
  name: PTZ Move
  description: Move a PTZ camera to a preset.
  fields:
    entity_id:
      name: Entity
      description: >-
        An entity of the camera to target. Use this or the camera ID.
      required: false
      selector:
        entity:
          integration: unifi_insights
          domain: camera
    device_id:
      name: Device
      description: >-
        The camera device to target. Use this or the camera ID.
      required: false
      selector:
        device:
          integration: unifi_insights
    camera_id:
      name: Camera ID
      description: The ID of the camera
      required: false
      selector:
        text:
    preset:
      name: Preset
      description: Preset number (0-15)
      required: true
      selector:
        number:
          min: 0
          max: 15
          step: 1

ptz_patrol:
  name: PTZ Patrol
  description: Control the patrol function on a PTZ camera.
  fields:
    entity_id:
      name: Entity
      description: >-
        An entity of the camera to target. Use this or the camera ID.
      required: false
      selector:
        entity:
          integration: unifi_insights
          domain: camera
    device_id:
      name: Device
      description: >-
        The camera device to target. Use this or the camera ID.
      required: false
      selector:
        device:
          integration: unifi_insights
    camera_id:
      name: Camera ID
      description: The ID of the camera
      required: false
      selector:
        text:
    action:
      name: Action
      description: Patrol action (start, stop)
      required: true
      selector:
        select:
          options:
            - "start"
            - "stop"
    slot:
      name: Slot
      description: Patrol slot number
      required: false
      selector:
        number:
          min: 0
          max: 15
          step: 1

# UniFi Protect Light services
set_light_mode:
  name: Set Light Mode
  description: Set the lighting mode for a UniFi Protect light.
  fields:
    entity_id:
      name: Entity
      description: >-
        An entity of the light to target. Use this or the light ID.
      required: false
      selector:
        entity:
          integration: unifi_insights
          domain: light
    device_id:
      name: Device
      description: >-
        The light device to target. Use this or the light ID.
      required: false
      selector:
        device:
          integration: unifi_insights
    light_id:
      name: Light ID
      description: The ID of the light
      required: false
      selector:
        text:
    mode:
      name: Mode
      description: Light mode (always, motion, off)
      required: true
      selector:
        select:
          options:
            - "always"
            - "motion"
            - "off"

set_light_level:
  name: Set Light Level
  description: Set the brightness level for a UniFi Protect light.
  fields:
    entity_id:
      name: Entity
      description: >-
        An entity of the light to target. Use this or the light ID.
      required: false
      selector:
        entity:
          integration: unifi_insights
          domain: light
    device_id:
      name: Device
      description: >-
        The light device to target. Use this or the light ID.
      required: false
      selector:
        device:
          integration: unifi_insights
    light_id:
      name: Light ID
      description: The ID of the light
      required: false
      selector:
        text:
    level:
      name: Brightness Level
      description: Brightness level (0-100)
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1

# UniFi Protect Chime services
set_chime_volume:
  name: Set Chime Volume
  description: Set the volume level for a UniFi Protect chime.
  fields:
    entity_id:
      name: Entity
      description: >-
        An entity of the chime to target. Use this or the chime ID.
      required: false
      selector:
        entity:
          integration: unifi_insights
    device_id:
      name: Device
      description: >-
        The chime device to target. Use this or the chime ID.
      required: false
      selector:
        device:
          integration: unifi_insights
    chime_id:
      name: Chime ID
      description: ID of the chime
      required: false
      example: "60e9c8c0e3e4b8001a123456"
      selector:
        text:
    volume:
      name: Volume
      description: Chime volume level (0-100)
      required: true
      example: 80
      selector:
        number:
          min: 0
          max: 100
          step: 1
    camera_id:
      name: Camera ID
      description: >-
        Optional camera ID, used only to validate that the camera belongs to
        the same console as the resolved chime. A camera known to belong to
        another console causes validation to fail and the action is rejected.
        Cameras absent from cached Protect data are allowed when no other
        console ownership is known. This integration applies the volume
        chime-wide.
      required: false
      example: "60e9c8c0e3e4b8001a123456"
      selector:
        text:

play_chime_ringtone:
  name: Play Chime Ringtone
  description: >-
    This action always raises a not supported error because the official
    Protect API has no chime playback route.
  fields:
    entity_id:
      name: Entity
      description: >-
        An entity of the chime to target. Use this or the chime ID.
      required: false
      selector:
        entity:
          integration: unifi_insights
    device_id:
      name: Device
      description: >-
        The chime device to target. Use this or the chime ID.
      required: false
      selector:
        device:
          integration: unifi_insights
    chime_id:
      name: Chime ID
      description: ID of the chime
      required: false
      example: "60e9c8c0e3e4b8001a123456"
      selector:
        text:
    ringtone_id:
      name: Ringtone ID
      description: >-
        Kept only so existing automations stay valid. The action raises the
        same not supported error with or without this field.
      required: false
      example: "example-ringtone-id"
      selector:
        text:

set_chime_ringtone:
  name: Set Chime Ringtone
  description: Set the ringtone for a UniFi Protect chime.
  fields:
    entity_id:
      name: Entity
      description: >-
        An entity of the chime to target. Use this or the chime ID.
      required: false
      selector:
        entity:
          integration: unifi_insights
    device_id:
      name: Device
      description: >-
        The chime device to target. Use this or the chime ID.
      required: false
      selector:
        device:
          integration: unifi_insights
    chime_id:
      name: Chime ID
      description: ID of the chime
      required: false
      example: "60e9c8c0e3e4b8001a123456"
      selector:
        text:
    ringtone_id:
      name: Ringtone ID
      description: >-
        Protect ringtone ID to set for every paired doorbell. Read IDs from
        the Ringtone select or its chime_ringtone_id attribute. The select
        lists only IDs already used by this console's chimes.
      required: true
      example: "example-ringtone-id"
      selector:
        text:
    camera_id:
      name: Camera ID
      description: >-
        Optional camera ID, used only to validate that the camera belongs to
        the same console as the resolved chime. A camera known to belong to
        another console causes validation to fail and the action is rejected.
        Cameras absent from cached Protect data are allowed when no other
        console ownership is known. This integration applies the ringtone
        chime-wide.
      required: false
      example: "60e9c8c0e3e4b8001a123456"
      selector:
        text:

set_chime_repeat_times:
  name: Set Chime Repeat Times
  description: Set the number of times a chime repeats when triggered.
  fields:
    entity_id:
      name: Entity
      description: >-
        An entity of the chime to target. Use this or the chime ID.
      required: false
      selector:
        entity:
          integration: unifi_insights
    device_id:
      name: Device
      description: >-
        The chime device to target. Use this or the chime ID.
      required: false
      selector:
        device:
          integration: unifi_insights
    chime_id:
      name: Chime ID
      description: ID of the chime
      required: false
      example: "60e9c8c0e3e4b8001a123456"
      selector:
        text:
    repeat_times:
      name: Repeat Times
      description: Number of times to repeat the chime (1-10)
      required: true
      example: 3
      selector:
        number:
          min: 1
          max: 10
          step: 1
    camera_id:
      name: Camera ID
      description: >-
        Optional camera ID, used only to validate that the camera belongs to
        the same console as the resolved chime. A camera known to belong to
        another console causes validation to fail and the action is rejected.
        Cameras absent from cached Protect data are allowed when no other
        console ownership is known. This integration applies the repeat
        count chime-wide.
      required: false
      example: "60e9c8c0e3e4b8001a123456"
      selector:
        text:

set_chime_paired_doorbells:
  name: Set Chime Paired Doorbells
  description: >-
    Choose which doorbells ring a UniFi Protect chime. The selection replaces
    the chime's current pairing. Leave Doorbells empty to unpair every
    doorbell.
  fields:
    entity_id:
      name: Entity
      description: >-
        An entity of the chime to target. Use this or the chime ID.
      required: false
      selector:
        entity:
          integration: unifi_insights
    device_id:
      name: Device
      description: >-
        The chime device to target. Use this or the chime ID.
      required: false
      selector:
        device:
          integration: unifi_insights
    chime_id:
      name: Chime ID
      description: >-
        ID of the chime. Not needed when the chime is picked as the target.
      required: false
      example: "60e9c8c0e3e4b8001a123456"
      selector:
        text:
    doorbells:
      name: Doorbells
      description: >-
        Doorbell ring sensors of this integration, or the doorbell devices or
        areas that hold them. Only doorbells on the chime's console are
        accepted.
      required: false
      example: "binary_sensor.front_doorbell_doorbell_ring"
      selector:
        target:
          entity:
            integration: unifi_insights
            domain: binary_sensor
            device_class: occupancy

# UniFi Network services
reconnect_client:
  fields:
    entity_id:
      name: Entity
      description: >-
        An entity of the client to target. Use this or the client ID.
      required: false
      selector:
        entity:
          integration: unifi_insights
    device_id:
      name: Device
      description: >-
        The client device to target. Use this or the client ID.
      required: false
      selector:
        device:
          integration: unifi_insights
    site_id:
      required: true
      selector:
        text:
    client_id:
      required: false
      selector:
        text:

remove_clients:

authorize_guest:
  name: Authorize Guest
  description: Authorize guest access for a client on the UniFi Network.
  fields:
    entity_id:
      name: Entity
      description: >-
        An entity of the client to target. Use this or the client ID.
      required: false
      selector:
        entity:
          integration: unifi_insights
    device_id:
      name: Device
      description: >-
        The client device to target. Use this or the client ID.
      required: false
      selector:
        device:
          integration: unifi_insights
    site_id:
      name: Site ID
      description: The site ID where the client is located
      required: true
      selector:
        text:
    client_id:
      name: Client ID
      description: The ID of the client to authorize
      required: false
      selector:
        text:
    duration_minutes:
      name: Duration (minutes)
      description: Duration of guest access in minutes
      required: false
      default: 480
      selector:
        number:
          min: 1
          max: 43200
    upload_limit_kbps:
      name: Upload Limit (kbps)
      description: Upload speed limit in kbps
      required: false
      selector:
        number:
          min: 0
    download_limit_kbps:
      name: Download Limit (kbps)
      description: Download speed limit in kbps
      required: false
      selector:
        number:
          min: 0
    data_limit_mb:
      name: Data Limit (MB)
      description: Total data limit in MB
      required: false
      selector:
        number:
          min: 0

generate_voucher:
  name: Generate Voucher
  description: Generate hotspot vouchers for guest WiFi access.
  fields:
    site_id:
      name: Site ID
      description: The site ID where to generate vouchers
      required: true
      selector:
        text:
    count:
      name: Count
      description: Number of vouchers to generate
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 100
    duration_minutes:
      name: Duration (minutes)
      description: Duration of voucher validity in minutes
      required: false
      default: 480
      selector:
        number:
          min: 1
          max: 43200
    upload_limit_kbps:
      name: Upload Limit (kbps)
      description: Upload speed limit in kbps
      required: false
      selector:
        number:
          min: 0
    download_limit_kbps:
      name: Download Limit (kbps)
      description: Download speed limit in kbps
      required: false
      selector:
        number:
          min: 0
    data_limit_mb:
      name: Data Limit (MB)
      description: Total data limit in MB
      required: false
      selector:
        number:
          min: 0
    note:
      name: Note
      description: Optional note for the voucher
      required: false
      selector:
        text:

delete_voucher:
  name: Delete Voucher
  description: Delete a hotspot voucher.
  fields:
    site_id:
      name: Site ID
      description: The site ID where the voucher is located
      required: true
      selector:
        text:
    voucher_id:
      name: Voucher ID
      description: The ID of the voucher to delete
      required: true
      selector:
        text:

export_network_rules:
  fields:
    site_id:
      required: false
      selector:
        text:
    console_id:
      required: false
      selector:
        text:
    rule_types:
      required: false
      selector:
        select:
          multiple: true
          options:
            - firewall_rule
            - policy_based_route
            - port_forward
            - traffic_rule
            - nat_rule
            - static_route
    redact:
      required: false
      default: true
      selector:
        boolean:

# UniFi Protect services
trigger_alarm:
  name: Trigger Alarm
  description: Trigger an alarm via the UniFi Protect alarm manager.
  fields:
    alarm_id:
      name: Alarm ID
      description: >-
        The user-defined alarm manager trigger ID to fire. This is a webhook
        trigger, not a device ID.
      required: true
      selector:
        text:
    console_id:
      name: Console
      description: >-
        Which console to use, given as the integration entry title or its entry
        ID. Only needed when more than one UniFi Protect console is configured,
        because this action carries no target to route on.
      required: false
      selector:
        text:

create_liveview:
  name: Create Live View
  description: Create a new live view in UniFi Protect.
  fields:
    name:
      name: Name
      description: Name of the live view
      required: true
      selector:
        text:
    layout:
      name: Layout
      description: Layout type (1-4)
      required: true
      selector:
        number:
          min: 1
          max: 4
    is_default:
      name: Is Default
      description: Set as default live view
      required: false
      default: false
      selector:
        boolean:
    console_id:
      name: Console
      description: >-
        Which console to use, given as the integration entry title or its entry
        ID. Only needed when more than one UniFi Protect console is configured,
        because this action carries no target to route on.
      required: false
      selector:
        text:

set_liveview:
  name: Set Live View
  description: Set the active live view for a viewer.
  fields:
    entity_id:
      name: Entity
      description: >-
        An entity of the viewer to target. Use this or the viewer ID.
      required: false
      selector:
        entity:
          integration: unifi_insights
    device_id:
      name: Device
      description: >-
        The viewer device to target. Use this or the viewer ID.
      required: false
      selector:
        device:
          integration: unifi_insights
    viewer_id:
      name: Viewer ID
      description: The ID of the viewer
      required: false
      selector:
        text:
    liveview_id:
      name: Live View ID
      description: The ID of the live view to set
      required: true
      selector:
        text:

carrier_suspend_subscriber:
  name: Suspend Subscriber
  description: >-
    Stop a subscriber's internet service. Requires the "Enable service actions"
    option to be enabled on the Carrier Fabric integration entry, and an ISP
    API key with the suspend:service scope.
  fields:
    entity_id:
      name: Entity
      description: >-
        An entity of the subscriber to target.
      required: false
      selector:
        entity:
          integration: unifi_insights
    device_id:
      name: Device
      description: >-
        The subscriber device to target.
      required: false
      selector:
        device:
          integration: unifi_insights
    reason:
      name: Reason
      description: >-
        Optional reason for stopping the subscriber's service (maximum 1024 characters).
      required: false
      selector:
        text:

carrier_resume_subscriber:
  name: Resume Subscriber
  description: >-
    Restore a subscriber's internet service. Requires the "Enable service actions"
    option to be enabled on the Carrier Fabric integration entry, and an ISP
    API key with the resume:service scope.
  fields:
    entity_id:
      name: Entity
      description: >-
        An entity of the subscriber to target.
      required: false
      selector:
        entity:
          integration: unifi_insights
    device_id:
      name: Device
      description: >-
        The subscriber device to target.
      required: false
      selector:
        device:
          integration: unifi_insights

set_access_user_pin:
  fields:
    user_id:
      required: true
      selector:
        text:
    pin:
      required: true
      selector:
        text:
          type: password
    console_id:
      required: false
      selector:
        text:

remove_access_user_pin:
  fields:
    user_id:
      required: true
      selector:
        text:
    console_id:
      required: false
      selector:
        text:

set_access_user_status:
  fields:
    user_id:
      required: true
      selector:
        text:
    status:
      required: true
      selector:
        select:
          options:
            - "ACTIVE"
            - "DEACTIVATED"
    console_id:
      required: false
      selector:
        text:
