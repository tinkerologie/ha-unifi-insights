<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Topology detail panel browser fixture</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        /* Minimal Home Assistant theme so panels are opaque. */
        --card-background-color: #fff;
        --primary-color: #03a9f4;
        --ha-color-text-secondary: #5e5e5e;
        --ha-color-fill-primary-quiet-resting: #eff9fe;
        --ha-color-fill-success-quiet-resting: #e3f9e3;
        --ha-color-fill-warning-quiet-resting: #fff0e4;
        --ha-color-fill-danger-quiet-resting: #fff0ef;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --text-primary-color: #fff;
        --divider-color: rgba(0, 0, 0, 0.12);
      }
      body {
        margin: 0;
        padding: 12px;
        background: #eee;
      }
      #frame {
        overflow: hidden;
        background: white;
      }
      #frame > * {
        display: block;
        width: 100%;
        height: 100%;
      }
      :root[data-theme="dark"] {
        --card-background-color: #1c1c1c;
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #b0b0b0;
        --ha-color-text-secondary: #b0b0b0;
        --ha-color-fill-primary-quiet-resting: #11333e;
        --ha-color-fill-success-quiet-resting: #16351f;
        --ha-color-fill-warning-quiet-resting: #422d13;
        --ha-color-fill-danger-quiet-resting: #421f24;
        --primary-color: #58c5eb;
        --text-primary-color: #111;
        --divider-color: rgba(255, 255, 255, 0.2);
      }
      :root[data-theme="dark"] body,
      :root[data-theme="dark"] #frame {
        background: #1c1c1c;
      }
    </style>
  </head>
  <body>
    <main id="frame"></main>
    <script type="module">
      const params = new URLSearchParams(location.search);
      const frame = document.querySelector("#frame");
      frame.style.width = `${params.get("width") ?? 800}px`;
      if (params.get("height") !== "auto")
        frame.style.height = `${params.get("height") ?? 360}px`;
      const requestedCard = params.get("card") ?? "topology";
      const cardOption = [
        { name: "topology", tag: "unifi-insights-topology-card" },
        { name: "site-health", tag: "unifi-insights-site-health-card" },
        {
          name: "internet-activity",
          tag: "unifi-insights-internet-activity-card",
        },
        { name: "performance", tag: "unifi-insights-performance-card" },
        { name: "protect-status", tag: "unifi-insights-protect-status-card" },
        { name: "timeline", tag: "unifi-insights-timeline-card" },
      ].find((option) => option.name === requestedCard);
      if (!cardOption) throw new Error("Unknown fixture card");
      const cardName = cardOption.name;
      const editorMode = params.get("editor") === "1";
      if (params.get("theme") === "dark")
        document.documentElement.dataset.theme = "dark";

      let snapshot = await fetch("/test/fixtures/site-topology.json").then(
        (response) => response.json(),
      );
      const uplink = snapshot.edges.find(
        (edge) => edge.source === "dev:uuid-core",
      );
      uplink.poe_power_w = 9.8;
      for (let index = 0; index < 12; index += 1) {
        const id = `cli:browser-${index}`;
        snapshot.nodes.push({
          id,
          kind: "client",
          name: `Browser fixture client ${index}`,
          state: "online",
          connection: "wired",
        });
        snapshot.edges.push({
          source: id,
          target: "dev:uuid-core",
          medium: "wired",
          parent_port: index + 1,
        });
      }

      if (params.has("unresolved")) {
        // The #186 report's card also showed this notice above the graph.
        snapshot.status = "partial";
        snapshot.issues.push({
          code: "parents_unresolved",
          severity: "warning",
        });
        snapshot.unresolved = Array.from(
          { length: Number(params.get("unresolved")) },
          (_, index) => ({
            node_id: `cli:unresolved-${index}`,
            reason: "no_uplink_data",
          }),
        );
      }

      if (cardName !== "topology") {
        const snapshots = await fetch(
          "/test/fixtures/dashboard-cards.json",
        ).then((response) => response.json());
        snapshot = structuredClone(snapshots[cardName]);
        if (!snapshot) throw new Error("Unknown fixture card");
        if (params.has("status")) snapshot.status = params.get("status");
      }
      await import("/topology-card.js");
      const listeners = new Map();
      const connection = {
        addEventListener(type, listener) {
          const group = listeners.get(type) ?? new Set();
          group.add(listener);
          listeners.set(type, group);
        },
        removeEventListener(type, listener) {
          listeners.get(type)?.delete(listener);
        },
        subscribeMessage(callback) {
          // Lets a test push a live update; same-revision pushes are ignored.
          let update = 0;
          window.fixtureUpdate = () =>
            callback({
              ...structuredClone(snapshot),
              revision: `${snapshot.revision}-${(update += 1)}`,
            });
          queueMicrotask(() => callback(snapshot));
          return Promise.resolve(async () => undefined);
        },
      };
      const tag = cardOption.tag;
      const card = document.createElement(
        `${tag}${editorMode ? "-editor" : ""}`,
      );
      card.setConfig({
        type: `custom:${tag}`,
        entry_id: "entry-1",
        site_id: "site-1",
        clients: params.get("clients") ?? "collapsed",
      });
      card.layout = params.get("layout") ?? "masonry";

      // Node details are only for administrators (?admin=1); the log
      // lets a test prove that nobody else ever asks for them.
      window.fixtureDetailsCalls = [];
      window.fixtureMoreInfo = [];
      document.addEventListener("hass-more-info", (event) =>
        window.fixtureMoreInfo.push(event.detail),
      );
      const detailsReady = params.has("deferDetails")
        ? new Promise((resolve) => {
            window.fixtureResolveDetails = resolve;
          })
        : Promise.resolve();
      const details = {
        "cli:browser-0": {
          kind: "client",
          ip_address: "192.0.2.77",
        },
        "dev:uuid-core": {
          kind: "switch",
          ip_address: "192.0.2.10",
          mac_address: "aa:bb:cc:dd:ee:ff",
          device_id: "reg-core",
          entity_id: "sensor.core_status",
        },
      };
      card.hass = {
        connection,
        locale: { language: "en" },
        user: { is_admin: params.get("admin") === "1" },
        callWS: async (message) => {
          if (message.type === "unifi_insights/topology/node_details") {
            window.fixtureDetailsCalls.push(message);
            await detailsReady;
            const answer = details[message.node_id];
            if (!answer) throw { code: "node_not_found", message: "" };
            return answer;
          }
          return [
            {
              entry_id: "entry-1",
              title: "Browser fixture",
              camera_count: 6,
              sites: [{ id: "site-1", name: "Home" }],
            },
          ];
        },
      };
      frame.append(card);
      while (
        !card.shadowRoot?.querySelector(
          editorMode
            ? cardName === "topology"
              ? "ha-form"
              : "select"
            : cardName === "topology"
              ? "uit-graph-view"
              : ".content",
        )
      ) {
        await new Promise((resolve) => requestAnimationFrame(resolve));
      }
      await card.updateComplete;
      window.fixtureCard = card;
      window.fixtureReady = true;
    </script>
  </body>
</html>
